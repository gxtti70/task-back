server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${JWT_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}
server.servlet.session.timeout=10m
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
jwt.secret=${JWT_SECRET}
jwt.access.expiration=600000
jwt.refresh.expiration=604800000
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# VAPID para notificaciones push (opcional; se generan automáticamente al arrancar si no se definen)
vapid.subject=mailto:admin@taskmanager.local
# vapid.public-key=...
# vapid.private-key=...

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
